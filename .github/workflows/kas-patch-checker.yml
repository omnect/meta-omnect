name: kas patches
on:
  pull_request:
    branches:
      - main
      - kirkstone
      - scarthgap
      - wrynose
    types:
      - opened
      - synchronize
      - reopened
jobs:
  oe-patch-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: oe.patch matches its oe_* sources
        shell: bash
        env:
          LC_ALL: C
        run: |
          cd kas/patches
          if ! cmp <(cat oe_*.patch) oe.patch; then
            echo "::error file=kas/patches/oe.patch::oe.patch is stale. Regenerate with: export LC_ALL=C && cat kas/patches/oe_*.patch > kas/patches/oe.patch"
            exit 1
          fi
