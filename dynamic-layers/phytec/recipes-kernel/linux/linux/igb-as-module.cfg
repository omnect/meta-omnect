# Build the Intel I210 (igb) driver as a loadable module instead of built-in.
#
# On the phyGATE-Tauri-L (imx8mm) the on-board FEC1 (DP83867) is forced to the
# fixed name "eth0" via the 'ethernet0' DT alias. When igb is built-in it probes
# during early kernel initcalls and claims "eth0" first, while FEC1 is still in
# deferred-probe (waiting on its MDIO/PHY). FEC's later retry then fails with
# -EEXIST (-17) and the on-board port never registers -> device unreachable.
# This race is timing-sensitive and becomes fully reproducible with a quiet
# console.
#
# Building igb as a module makes it load later (via udev coldplug, after the
# rootfs is up), so FEC1 deterministically wins "eth0" during initcalls and igb
# gets "eth1". No source patch and no interface-renaming .link needed, and it
# also keeps eth0=FEC in the flash-mode initramfs (where igb.ko is not loaded).
CONFIG_IGB=m
